name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download fonts
        run: |
          mkdir -p DealHunt/app/src/main/res/font
          curl -L "https://fonts.gstatic.com/s/rajdhani/v10/LDI2apCSOBg7S-QT7pasEfOO.woff2" -o /tmp/raj.woff2 || true
          wget --tries=3 -q "https://github.com/google/fonts/raw/refs/heads/main/ofl/rajdhani/Rajdhani-Bold.ttf" -O DealHunt/app/src/main/res/font/rajdhani_bold.ttf || \
          curl -L "https://github.com/google/fonts/raw/refs/heads/main/ofl/rajdhani/Rajdhani-Bold.ttf" -o DealHunt/app/src/main/res/font/rajdhani_bold.ttf
          wget --tries=3 -q "https://github.com/google/fonts/raw/refs/heads/main/ofl/rajdhani/Rajdhani-SemiBold.ttf" -O DealHunt/app/src/main/res/font/rajdhani_semibold.ttf || \
          curl -L "https://github.com/google/fonts/raw/refs/heads/main/ofl/rajdhani/Rajdhani-SemiBold.ttf" -o DealHunt/app/src/main/res/font/rajdhani_semibold.ttf
          wget --tries=3 -q "https://github.com/google/fonts/raw/refs/heads/main/ofl/dmsans/DMSans%5Bopsz%2Cwght%5D.ttf" -O DealHunt/app/src/main/res/font/dm_sans_regular.ttf || \
          curl -L "https://github.com/google/fonts/raw/refs/heads/main/ofl/dmsans/DMSans%5Bopsz%2Cwght%5D.ttf" -o DealHunt/app/src/main/res/font/dm_sans_regular.ttf
          ls -la DealHunt/app/src/main/res/font/

      - name: Grant execute permission for gradlew
        run: chmod +x DealHunt/gradlew

      - name: Build Debug APK
        working-directory: DealHunt
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DealHunt-APK
          path: DealHunt/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
