name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download fonts
        run: |
          mkdir -p DealHunt/app/src/main/res/font
          wget -q "https://github.com/google/fonts/raw/main/ofl/rajdhani/Rajdhani-Bold.ttf" -O DealHunt/app/src/main/res/font/rajdhani_bold.ttf
          wget -q "https://github.com/google/fonts/raw/main/ofl/rajdhani/Rajdhani-SemiBold.ttf" -O DealHunt/app/src/main/res/font/rajdhani_semibold.ttf
          wget -q "https://github.com/google/fonts/raw/main/ofl/dmsans/DMSans-Regular.ttf" -O DealHunt/app/src/main/res/font/dm_sans_regular.ttf

      - name: Grant execute permission for gradlew
        run: chmod +x DealHunt/gradlew

      - name: Build Debug APK
        working-directory: DealHunt
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DealHunt-APK
          path: DealHunt/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
